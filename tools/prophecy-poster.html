<body>
<svg id="poster" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3456 864"></svg>
<script type="module">
// Prophecy Map: 7,000 years, foretold → fulfilled. 48 × 12 in, units = points (1/72 in).
import * as D from '../engine/dss.js';

const params = new URLSearchParams(location.search);
const WIN = +params.get('w') || 48, HIN = +params.get('h') || 12;           // paper size in inches
const PW = WIN * 72, PH = HIN * 72;                                         // page in points
const K = Math.min(PW / 3456, PH / 864);                                    // chrome scale vs the 48 × 12 design
const W = PW / K, H = PH / K, M = 36;                                       // design space (scaled by K on output)
const OTHERS = params.get('others') !== '0';          // add Dead Sea Scroll–referenced items from other teachers

const C = {
  paper: '#FAF7F0', ink: '#1B2427', muted: '#5C6A6E', faint: '#A9B3B5', rule: '#4E5D61', title: '#0F4C5A',
  messiah: '#B7862C', israel: '#1B6577', church: '#7B4F8E', scrolls: '#5E7F3A', future: '#3B4FA0',
};
const DAYS = ['#EFE6D2', '#E6EDE4', '#E1EBEC', '#ECE4DA', '#E9E2EC', '#E3E7EF', '#F1EAD0'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f1 = n => (+n).toFixed(1);

const [table, all, events] = await Promise.all(['../engine/tekufah-table.json', '../data/prophecies.json', '../data/events.json'].map(u => fetch(u).then(r => r.json())));
D.init(table);
await document.fonts.load('10px "Alegreya Sans"'); await document.fonts.load('700 10px "Alegreya Sans"');
await document.fonts.load('10px Alegreya'); await document.fonts.load('italic 10px "Alegreya Sans"');
await document.fonts.load('700 10px "Alegreya Sans SC"'); await document.fonts.load('500 10px "Alegreya Sans SC"'); await document.fonts.load('500 10px Alegreya');
await document.fonts.ready;
const cv = document.createElement('canvas').getContext('2d');
const tw = (s, font) => { cv.font = font; return cv.measureText(s).width; };

// ---------- selection ----------
const isJ = p => p.kj || p.n || /^(apr|age)-/.test(p.id);
let items = all.filter(isJ);
if (OTHERS) {
  const seen = new Set(items.map(p => (p.ref || '') + '|' + Math.round(p.f?.am ?? -1)));
  for (const p of all.filter(p => !isJ(p) && p.dss)) {
    const k = (p.ref || '') + '|' + Math.round(p.f?.am ?? -1);
    if (seen.has(k)) continue; seen.add(k); items.push(p);
  }
}
const NOW = 5951; // AD 2026
const FUT = { 'The Birth Pangs': 5958, 'After 2008': 5956, 'First half of the Tribulation': 5970, 'The Invasion of Israel': 5968,
  "The Antichrist's rise to power": 5966, 'The Person of the Antichrist': 5967, "The Antichrist's identifying characteristics": 5967,
  'The Religion of the Antichrist': 5972, 'The Abomination of Desolation': 5974, 'Antichrist rules supreme': 5975, 'The Persecution': 5976,
  'Second half of the Tribulation': 5978, 'The wars of the Antichrist': 5979, 'The Wrath': 5980, "The Antichrist's Destruction": 5982,
  'The Second Coming': 5984, 'The Millennium': 6300 };
const yearOf = am => { const y = Math.floor(am) - D.EPOCH_OFFSET; return y <= 0 ? `${1 - y} BC` : `AD ${y}`; };

  if (/^\d{3,4}$/.test((lbl || '').match(/\b(1[5-9]\d\d|20\d\d)\b/)?.[0] || '') && !m) s = 'AD ' + lbl.match(/\b(1[5-9]\d\d|20\d\d)\b/)[0];

}
function cat(p) {
  if (p.st === 'future' || !p.f) return 'future';
  if (/^age-/.test(p.id)) return 'church';
  if (p.dss) return 'scrolls';
  if (p.f.am >= 3920 && p.f.am <= 3962) return 'messiah';
  return 'israel';

const dssShort = s => (s || '').split(/[;,]/)[0].replace(/\s*\(.*$/, '').replace(/\s+(quotes|cols?\.).*$/, '').trim();

const rows = items.map(p => {
  const k = cat(p);
  const fam = p.f ? p.f.am : (FUT[p.sec] ?? 5985);
  return {
    p, k, gam: p.g.am, fam,
    ref: (p.ref || '').replace(/\s*\([^)]*\)?\s*/g, ' ').replace(/\s+/g, ' ').trim(),
    dss: dssShort(p.dss),
    num: p.n ? '#' + p.n : '',

    when: `${shortDate(p.g.label, p.g.am, p.g.approx)} → ${p.f ? shortDate(p.f.label, p.f.am, p.f.approx) : 'yet future'}`,
    partial: p.st === 'partial',

}).sort((a, b) => a.fam - b.fam || a.gam - b.gam || (a.p.n || 999) - (b.p.n || 999));

// ---------- vertical layout ----------
const headH = 74, arcTop = M + headH, axisY = Math.round(338 + 0.22 * (H - 864)), bandH = 26, fanTop = axisY + bandH + 4, colTop = fanTop + 58, colBot = H - M - 16;

for (let i = 0; i < NB; i++) { let s = 0, w = 0; for (let j = -9; j <= 9; j++) { const k = i + j; if (k < 0 || k >= NB) continue; const g = Math.exp(-(j * j) / (2 * SIG * SIG)); s += dens[k] * g; w += g; } sm[i] = s / w; }

let svg = '';

// ---------- background, the seven "days" ----------
svg += `<rect width="${W}" height="${H}" fill="${C.paper}"/>`;
const DAYNAMES = ['First', 'Second', 'Third', 'Fourth', 'Fifth', 'Sixth', 'Seventh'];
for (let d = 0; d < 7; d++) {
  const x0 = X(d * 1000 + 1), x1 = X((d + 1) * 1000 + 1);
  svg += `<rect x="${f1(x0)}" y="${axisY}" width="${f1(x1 - x0)}" height="${bandH}" fill="${DAYS[d]}"/>`;
  svg += `<rect x="${f1(x0)}" y="${arcTop - 6}" width="${f1(x1 - x0)}" height="${axisY - arcTop + 6}" fill="${DAYS[d]}" opacity="0.28"/>`;
  if (d) svg += `<line x1="${f1(x0)}" y1="${arcTop - 6}" x2="${f1(x0)}" y2="${axisY + bandH}" stroke="${C.faint}" stroke-width="0.6" stroke-dasharray="2 3"/>`;
  const lbl = d === 6 ? 'Seventh day · the Sabbath millennium' : `${DAYNAMES[d]} day`;
  const sub = `${d * 1000 + 1}–${(d + 1) * 1000} AM · ${yearOf(d * 1000 + 1)} – ${yearOf((d + 1) * 1000)}`;
  const cx = (x0 + x1) / 2, wide = x1 - x0;
  const fs = wide > 260 ? 10 : 8.5;
  if (wide > 70) {
    svg += T(cx, axisY + 11, lbl.toUpperCase(), { ff: 'Alegreya Sans SC', fw: 700, fs, a: 'middle', fill: C.title, ls: 1.2 });

}
svg += `<line x1="${left}" y1="${axisY}" x2="${right}" y2="${axisY}" stroke="${C.rule}" stroke-width="1.2"/>`;
svg += `<line x1="${left}" y1="${axisY + bandH}" x2="${right}" y2="${axisY + bandH}" stroke="${C.rule}" stroke-width="0.5"/>`;

// "Yet future" hatching and Today marker
const xNow = X(NOW);
svg += `<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${C.future}" stroke-width="0.6" opacity="0.18"/></pattern>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="context-stroke"/></marker></defs>`;
svg += `<rect x="${f1(xNow)}" y="${arcTop - 6}" width="${f1(right - xNow)}" height="${axisY - arcTop + 6}" fill="url(#hatch)"/>`;
svg += `<line x1="${f1(xNow)}" y1="${arcTop - 6}" x2="${f1(xNow)}" y2="${axisY + bandH}" stroke="${C.future}" stroke-width="0.9"/>`;
svg += T(xNow - 4, arcTop + 6, 'TODAY · 5951 AM · AD 2026', { ff: 'Alegreya Sans SC', fw: 700, fs: 7.5, a: 'end', fill: C.future, ls: 0.8 });
svg += T(xNow + 5, arcTop + 6, 'YET FUTURE', { ff: 'Alegreya Sans SC', fw: 700, fs: 7.5, fill: C.future, ls: 0.8 });

// ---------- ticks (deduped by distance) ----------
let lastTick = -1e9;
const tickYears = [];
for (let am = 100; am < 7000; am += 100) tickYears.push(am);
for (let am = 3900; am < 4000; am += 10) if (am % 100) tickYears.push(am);
tickYears.sort((a, b) => a - b);
for (const am of tickYears) {
  const x = X(am);
  const major = am % 500 === 0;
  svg += `<line x1="${f1(x)}" y1="${axisY}" x2="${f1(x)}" y2="${axisY - (major ? 6 : 3.5)}" stroke="${C.rule}" stroke-width="${major ? 0.9 : 0.5}"/>`;
}
// ---------- landmarks ----------
const amOf = re => { const e = events.find(v => re.test(v.t)); return e ? D.fromJdn(e.j).am : null; };
const LM = [
  [1, 'Creation'], [1656, 'The Flood'], [amOf(/^Abraham born/) ?? 2008, 'Abraham'], [amOf(/departs from Rameses/) ?? 2448, 'Exodus'],
  [2935, "Solomon's Temple"], [3338, 'Jerusalem falls to Babylon'], [3957, 'The Cross · AD 32'], [3995, 'Temple destroyed · AD 70'],
  [5873, 'Israel reborn · 1948'], [6000, '6000 AM'],
];
const lmPlaced = [], lmText = [];
for (const [am, name] of LM) {
  const x = X(am);
  const w = tw(name, '700 7.5px "Alegreya Sans"') + 8;
  let lane = 0; while (lmPlaced.some(o => o.lane === lane && Math.abs(o.x - x) < (o.w + w) / 2 + 4)) lane++;
  lmPlaced.push({ x, w, lane });
  const y = axisY - 9 - lane * 10;
  svg += `<circle cx="${f1(x)}" cy="${axisY}" r="2.4" fill="${C.paper}" stroke="${C.rule}" stroke-width="1"/>`;
  lmText.push(T(x, y, name, { fw: 700, fs: 7.5, a: am < 50 ? 'start' : 'middle', fill: C.rule }).replace('<text ', `<text stroke="${C.paper}" stroke-width="3" paint-order="stroke" stroke-linejoin="round" `));
}

// ---------- arcs ----------
const groups = new Map();
for (const r of rows) { const k = Math.round(X(r.gam)) + ':' + Math.round(X(r.fam)); r.rank = groups.get(k) || 0; groups.set(k, r.rank + 1); }
const maxArc = axisY - arcTop - 24;
const arcRows = [...rows].sort((a, b) => Math.abs(X(b.fam) - X(b.gam)) - Math.abs(X(a.fam) - X(a.gam)));
for (const r of arcRows) {
  const x1 = X(r.gam), x2 = X(r.fam), dx = Math.abs(x2 - x1);
  const c = C[r.k];
  const dash = r.k === 'future' ? ' stroke-dasharray="3 2.2"' : r.partial ? ' stroke-dasharray="6 2 1.5 2"' : '';
  if (dx < 3) { svg += `<circle cx="${f1(x1)}" cy="${axisY - 5}" r="4" fill="none" stroke="${c}" stroke-width="0.6" opacity="0.6"/>`; continue; }
  const h = Math.min(maxArc, 14 + maxArc * Math.pow(dx / span, 0.62) * 1.05) * (1 + 0.012 * Math.min(r.rank, 40));
  const hh = Math.min(maxArc + 10, h);
  // cubic arch from foretold to fulfilled
  const cy = axisY - hh * 1.333;
  svg += `<path d="M${f1(x1)},${axisY} C${f1(x1)},${f1(cy)} ${f1(x2)},${f1(cy)} ${f1(x2)},${axisY}" fill="none" stroke="${c}" stroke-width="${r.k === 'messiah' ? 0.55 : 0.7}" opacity="${r.k === 'messiah' ? 0.42 : 0.55}"${dash} marker-end="url(#ah)"/>`;
}
// foretold dots on the axis
for (const r of rows) svg += `<circle cx="${f1(X(r.gam))}" cy="${axisY}" r="1.3" fill="${C[r.k]}" opacity="0.8"/>`;

svg += lmText.join('');
// ---------- index columns (every entry wraps; nothing is cut) ----------
const avail = colBot - colTop;
const FK = { ref: '700 10px "Alegreya Sans"', dss: 'italic 400 10px "Alegreya Sans"', title: '400 10px "Alegreya Sans"', num: '500 8.2px "Alegreya Sans"', when: '500 10px "Alegreya Sans"' };
const wc = new Map();
const w10 = (s, k) => { const key = k + '|' + s; let v = wc.get(key); if (v == null) { v = tw(s, FK[k]); wc.set(key, v); } return v; };
for (const r of rows) {
  const tok = [];
  r.ref.split(' ').filter(Boolean).forEach(t => tok.push({ s: t, k: 'ref' }));
  if (r.dss && !r.ref.includes(r.dss)) r.dss.split(' ').forEach(t => tok.push({ s: t, k: 'dss' }));
  (r.title + (r.partial ? ' (in part)' : '')).split(' ').filter(Boolean).forEach(t => tok.push({ s: t, k: 'title' }));
  if (r.num) tok.push({ s: r.num, k: 'num' });
  r.tok = tok; r.whenW10 = w10(r.when, 'when');
}
const SP = 0.26;                       // word space, in em
function wrap(r, fs, colW) {
  const ind = fs * 0.6, sc = fs / 10;
  const lines = [[]]; let x = 0, lim = colW - ind - r.whenW10 * sc - fs * 0.8;
  for (const t of r.tok) {
    const w = w10(t.s, t.k) * sc, gap = x ? fs * SP + (t.k !== lines.at(-1).at(-1)?.k ? fs * 0.15 : 0) : 0;
    if (x && x + gap + w > lim) {
      const prev = lines.at(-1);
      lines.push([]); lim = colW - ind - fs * 0.5;
      // never leave the grey Johnson number alone on a line: carry the last word down with it
      if (t.k === 'num' && prev.length > 1) { const mv = prev.pop(); lines.at(-1).push({ ...mv, x: 0 }); x = w10(mv.s, mv.k) * sc; }
      else x = 0;

    const g = x ? gap : 0;

  }

const LH = 1.2, EGAP = 0.32, HDR = 2.2;
function pack(fs, colW, ncol) {
  const lh = fs * LH, hts = rows.map(r => wrap(r, fs, colW).length * lh + fs * EGAP);
  const cap = avail - fs * HDR;
  const fits = c => { let n = 1, h = 0; for (const v of hts) { if (v > c) return false; if (h + v > c) { n++; h = 0; } h += v; } return n <= ncol; };
  if (!fits(cap)) return null;
  let lo = hts.reduce((a, b) => a + b, 0) / ncol, hi = cap;   // balance columns: smallest height that still fits
  for (let k = 0; k < 18; k++) { const m = (lo + hi) / 2; fits(m) ? hi = m : lo = m; }
  const cols = [[]]; let h = 0;
  rows.forEach((r, i) => { if (h + hts[i] > hi && cols.at(-1).length) { cols.push([]); h = 0; } cols.at(-1).push(r); h += hts[i]; });

const gutter = 12;
let fs, colW, cols;
search: for (fs = 10; fs > 4; fs = +(fs - 0.1).toFixed(2)) {
  for (let n = 6; n <= 30; n++) {
    colW = (span - gutter * (n - 1)) / n;
    if (colW < fs * 30) break;

    cols = pack(fs, colW, n);
    if (cols) break search;
  }
}
const ncol = cols.length;
colW = (span - gutter * (ncol - 1)) / ncol;
cols = pack(fs, colW, ncol) || cols;
const lh = fs * LH;
const FILL = { ref: C.ink, dss: C.scrolls, title: '#34403F', num: C.faint };
cols.forEach((chunk, c) => {

  svg += `<line x1="${f1(ax0)}" y1="${axisY + bandH + 0.5}" x2="${f1(ax1)}" y2="${axisY + bandH + 0.5}" stroke="${C[dom]}" stroke-width="2"/>`;
  const hdr = fN >= NOW ? (f0 >= NOW ? 'Yet future' : `Fulfilled ${yearOf(f0)} → yet future`) : (yearOf(f0) === yearOf(fN) ? `Fulfilled ${yearOf(f0)}` : `Fulfilled ${yearOf(f0)} – ${yearOf(fN)}`);
  const hy = colTop - fs * 0.9;
  svg += T(cx0, hy, hdr.toUpperCase(), { ff: 'Alegreya Sans SC', fw: 700, fs: fs * 0.95, fill: C[dom], ls: 0.6 });
  svg += `<line x1="${f1(cx0)}" y1="${f1(hy + fs * 0.4)}" x2="${f1(cx1)}" y2="${f1(hy + fs * 0.4)}" stroke="${C[dom]}" stroke-width="0.6"/>`;

    const base = y + fs * EGAP / 2 + lh * 0.82;
    svg += `<rect x="${f1(cx0)}" y="${f1(base - fs * 0.74)}" width="${f1(fs * 0.28)}" height="${f1(lines.length * lh - lh + fs * 0.88)}" fill="${C[r.k]}"${r.k === 'future' ? ' opacity="0.65"' : ''}/>`;

// ---------- header ----------
svg += T(M, M + 30, 'Seven Thousand Years of Prophecy', { ff: 'Alegreya', fw: 500, fs: 38, fill: C.title });
const subX = M + tw('Seven Thousand Years of Prophecy', '500 38px Alegreya') + 22;
svg += T(subX, M + 15, 'Foretold → fulfilled, from Creation (1 AM · 3925 BC) to the end of the seventh millennium', { fs: 12.5, fill: C.ink });
svg += T(subX, M + 31, `${rows.length} prophecies · Scripture and Dead Sea Scroll references · dates on Ken Johnson's chronology (AM = AD + 3925) · "c." = approximate`, { fs: 10.5, fill: C.muted });
// legend
const LEG = [['messiah', "Messiah's first coming", ''], ['israel', 'Israel & the nations', ''], ['church', 'The church ages', ''], ['scrolls', 'With a Dead Sea Scroll witness', ''], ['future', 'Yet future', '3 2.2']];
let lx = right;
const legItems = LEG.map(([k, l, d]) => ({ k, l, d, w: tw(l, '500 10px "Alegreya Sans"') + 34 })).reverse();
for (const it of legItems) {
  lx -= it.w;
  svg += `<path d="M${f1(lx)},${M + 20} q12,-14 24,0" fill="none" stroke="${C[it.k]}" stroke-width="1.6"${it.d ? ` stroke-dasharray="${it.d}"` : ''}/>`;
  svg += T(lx + 28, M + 23, it.l, { fw: 500, fs: 10, fill: C.ink });
}
svg += T(right, M + 40, 'Arcs rise from when a prophecy was given to when it was fulfilled; each column below lists the prophecies fulfilled in the span its funnel marks on the timeline.', { fs: 8.5, a: 'end', fill: C.muted, it: 1 });
svg += `<line x1="${M}" y1="${M + headH - 18}" x2="${right}" y2="${M + headH - 18}" stroke="${C.title}" stroke-width="0.8"/>`;

// ---------- footer ----------
svg += T(M, H - M + 6, "Sources: Ken Johnson, Ancient Prophecies Revealed (#1–485; numbers in grey) and his biblical chronology; Scripture (KJV); Dead Sea Scroll manuscripts in italic green (e.g. 1QIsa-a, the Great Isaiah Scroll; 4Q174; 11Q13). Fulfilment years follow Johnson where he gives them; foretold dates are approximate dates of the prophet.", { fs: 7.5, fill: C.muted });
svg += T(right, H - M + 6, 'DSS Calendar · dss-calendar.pages.dev · after Ken Johnson & dsscalendar.org', { fs: 7.5, a: 'end', fill: C.muted });

const el = document.getElementById('poster');
el.setAttribute('viewBox', `0 0 ${PW} ${PH}`); el.style.width = WIN + 'in'; el.style.height = HIN + 'in';
el.innerHTML = `<g transform="scale(${K})">${svg}</g>`;
const lines = rows.reduce((a, r) => a + wrap(r, fs, colW).length, 0);
window.__poster = { n: rows.length, size: `${WIN}x${HIN}`, listPt: +(fs * K).toFixed(2), ncol, colW: Math.round(colW * K), wrapped: rows.filter(r => wrap(r, fs, colW).length > 1).length, lines };
document.body.dataset.ready = '1';
</script>
